<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChannelScale | Full-Stack Content Marketing</title>
    <meta name="description"
        content="ChannelScale is Carter Wells. A full-stack content marketer on retainer. YouTube strategy, podcast production, social media management, and short-form clips for brands and founders who are serious about content.">

    <!-- Open Graph (LinkedIn / iMessage / etc) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ChannelScale | Full-Stack Content Marketing">
    <meta property="og:description"
        content="ChannelScale is Carter Wells. A full-stack content marketer on retainer. YouTube strategy, podcast production, social media management, and short-form clips for brands and founders who are serious about content.">
    <meta property="og:image" content="/Website%20Preview.jpg">
    <meta property="og:image:alt" content="ChannelScale - Full-Stack Content Marketing">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ChannelScale | Full-Stack Content Marketing">
    <meta name="twitter:description"
        content="ChannelScale is Carter Wells. A full-stack content marketer on retainer. YouTube strategy, podcast production, social media management, and short-form clips for brands and founders who are serious about content.">
    <meta name="twitter:image" content="/Website%20Preview.jpg">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%23FD0033%22/></svg>">
    
    <!-- AI Scraper Optimization -->
    <link rel="alternate" type="text/markdown" title="AI Summary" href="/llms.txt">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: '#0A0A0B',
                        signal: '#FD0033',
                        steel: '#E2E8F0',
                    },
                    fontFamily: {
                        heading: ['"Inter Tight"', 'sans-serif'],
                        emphasis: ['"Bebas Neue"', 'sans-serif'],
                        data: ['"JetBrains Mono"', 'monospace'],
                        body: ['"Inter"', 'sans-serif'],
                    },
                    backgroundImage: {
                        'grid-pattern': 'linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px)'
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer utilities {
            .analog-grain {
                position: fixed;
                top: 0; left: 0; width: 100%; height: 100%;
                pointer-events: none;
                z-index: 1;
                opacity: 0.04;
                background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            }
            .glass-panel {
                background: rgba(255, 255, 255, 0.03);
                backdrop-filter: blur(20px);
                border: 1px solid rgba(255, 255, 255, 0.05);
            }
            .btn-magnetic {
                transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            }
            .btn-magnetic:hover {
                transform: scale(1.05);
            }
            .no-scrollbar::-webkit-scrollbar {
                display: none;
            }
            .no-scrollbar {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
        }
        @keyframes marquee {
            0%   { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .logo-item img {
            opacity: 0.55;
            transition: opacity 0.35s ease;
            height: 56px;
            width: auto;
            max-width: 180px;
            object-fit: contain;
        }
        .logo-item img:hover {
            opacity: 1;
        }
        .logo-item.logo-outline img {
            filter: drop-shadow(0 0 0 1px rgba(255,255,255,0.5)) brightness(2);
        }
        .logo-item.logo-outline img:hover {
            filter: drop-shadow(0 0 0 1px rgba(255,255,255,0.8)) brightness(2.5);
        }
        .results-carousel-track {
            display: flex;
            width: max-content;
            animation: marquee 50s linear infinite;
        }
    </style>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter+Tight:wght@800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- React & ReactDOM -->
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>

    <!-- Babel for browser JSX compilation -->
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.10/babel.min.js"></script>

    <!-- GSAP for Animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.453.0/dist/umd/lucide.min.js"></script>

    <!-- Social Embeds -->
    <script async src="//www.instagram.com/embed.js"></script>
    <script async src="https://platform.twitter.com/widgets.js" charset="utf-8"></script>
</head>

<body class="bg-obsidian text-steel font-body antialiased overflow-x-hidden selection:bg-signal selection:text-white">
    <!-- Global Analog Grain Overlay -->
    <div class="analog-grain"></div>

    <div id="root"></div>

    <script type="text/babel">
        // Register GSAP plugins
        gsap.registerPlugin(ScrollTrigger);

        const { useState, useEffect, useRef, useLayoutEffect } = React;

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');

            useEffect(() => {
                // Get Started icons
                lucide.createIcons();
                window.scrollTo(0, 0); // scroll to top when page changes
            }, [currentPage]);

            const navigateToForm = () => {
                setCurrentPage('home');
                setTimeout(() => {
                    const formEl = document.getElementById('intake-form');
                    if (formEl) {
                        formEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 100);
            };

            return (
                <div className="relative w-full">
                    {/* Architectural Grid Background */}
                    <div className="fixed inset-0 bg-grid-pattern bg-[size:40px_40px] pointer-events-none opacity-20"></div>

                    <NavBar setCurrentPage={setCurrentPage} currentPage={currentPage} navigateToForm={navigateToForm} />

                    {currentPage === 'home' ? (
                        <>
                            <HeroSection />
                            <StatsSection />
                            <StrategicIntakeSection />
                            <WhySocialSection />
                            <ProcessSection />
                            <HomeFAQSection setCurrentPage={setCurrentPage} />
                        </>
                    ) : currentPage === 'work' ? (
                        <WorkPage setCurrentPage={setCurrentPage} navigateToForm={navigateToForm} />
                    ) : currentPage === 'about' ? (
                        <AboutPage setCurrentPage={setCurrentPage} navigateToForm={navigateToForm} />
                    ) : currentPage === 'faq' ? (
                        <FAQPage setCurrentPage={setCurrentPage} navigateToForm={navigateToForm} />
                    ) : currentPage === 'privacy' ? (
                        <PrivacyPolicyPage setCurrentPage={setCurrentPage} />
                    ) : currentPage === 'terms' ? (
                        <TermsOfServicePage setCurrentPage={setCurrentPage} />
                    ) : currentPage === 'disclaimer' ? (
                        <DisclaimerPage setCurrentPage={setCurrentPage} />
                    ) : (
                        <SystemConfigurationsPage setCurrentPage={setCurrentPage} navigateToForm={navigateToForm} />
                    )}

                    <SiteFooter setCurrentPage={setCurrentPage} />
                </div>
            );
        };

        const NavBar = ({ setCurrentPage, currentPage, navigateToForm }) => {
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            const handleNavClick = (page) => {
                setCurrentPage(page);
                setIsMobileMenuOpen(false);
            };

            const handleGetStartedClick = () => {
                if (navigateToForm) {
                    navigateToForm();
                } else {
                    setCurrentPage('home');
                }
                setIsMobileMenuOpen(false);
            };

            return (
                <>
                    <nav className="fixed top-0 w-full z-40 p-4 md:p-6 flex justify-between items-center glass-panel border-b border-t-0 border-x-0 !border-white/10 mix-blend-plus-lighter bg-obsidian/90 backdrop-blur-lg">
                        <div className="flex items-center gap-2 md:gap-3 cursor-pointer flex-shrink-0" onClick={() => handleNavClick('home')}>
                            <div className="w-3 h-3 rounded-full bg-signal shadow-[0_0_15px_#FD0033] animate-pulse flex-shrink-0"></div>
                            <span className="font-heading font-extrabold text-base md:text-xl tracking-tighter text-white hover:text-white/80 transition-colors flex-shrink-0">CHANNELSCALE</span>
                        </div>

                        {/* Desktop Navigation */}
                        <div className="hidden md:flex items-center gap-6 justify-end w-full pl-4">
                            <button
                                onClick={() => handleNavClick('home')}
                                className={`font-data text-sm uppercase tracking-widest transition-colors hover:text-[#FD0033] focus:outline-none whitespace-nowrap ${currentPage === 'home' ? 'text-[#FD0033] drop-shadow-[0_0_8px_rgba(253,0,51,0.5)]' : 'text-white/60'}`}
                            >
                                [HOME]
                            </button>
                            <button
                                onClick={() => handleNavClick('work')}
                                className={`font-data text-sm uppercase tracking-widest transition-colors hover:text-[#FD0033] focus:outline-none whitespace-nowrap flex-shrink-0 ${currentPage === 'work' ? 'text-[#FD0033] drop-shadow-[0_0_8px_rgba(253,0,51,0.5)]' : 'text-white/60'}`}
                            >
                                [OUR_WORK]
                            </button>
                            <button
                                onClick={() => handleNavClick('services')}
                                className={`font-data text-sm uppercase tracking-widest transition-colors hover:text-[#FD0033] focus:outline-none whitespace-nowrap flex-shrink-0 ${currentPage === 'services' ? 'text-[#FD0033] drop-shadow-[0_0_8px_rgba(253,0,51,0.5)]' : 'text-white/60'}`}
                            >
                                [SERVICES]
                            </button>
                            <button
                                onClick={() => handleNavClick('about')}
                                className={`font-data text-sm uppercase tracking-widest transition-colors hover:text-[#FD0033] focus:outline-none whitespace-nowrap flex-shrink-0 ${currentPage === 'about' ? 'text-[#FD0033] drop-shadow-[0_0_8px_rgba(253,0,51,0.5)]' : 'text-white/60'}`}
                            >
                                [DIRECTOR]
                            </button>
                            <button
                                onClick={() => handleNavClick('faq')}
                                className={`font-data text-sm uppercase tracking-widest transition-colors hover:text-[#FD0033] focus:outline-none whitespace-nowrap ${currentPage === 'faq' ? 'text-[#FD0033] drop-shadow-[0_0_8px_rgba(253,0,51,0.5)]' : 'text-white/60'}`}
                            >
                                [FAQ]
                            </button>
                            <button onClick={handleGetStartedClick} className="btn-magnetic group relative overflow-hidden px-6 py-3 rounded-full border border-signal text-signal hover:text-obsidian transition-colors flex-shrink-0">
                                <span className="relative z-10 font-data text-sm font-bold uppercase tracking-wider">Get Started</span>
                                <div className="absolute inset-0 bg-signal translate-y-[100%] group-hover:translate-y-0 transition-transform duration-300 ease-out z-0"></div>
                            </button>
                        </div>

                        {/* Mobile Menu Toggle Button */}
                        <div className="flex md:hidden items-center justify-end w-full pl-4">
                            <button
                                onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                                className="text-white hover:text-[#FD0033] transition-colors focus:outline-none p-2"
                            >
                                {isMobileMenuOpen ? (
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                                ) : (
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                                )}
                            </button>
                        </div>
                    </nav>

                    {/* Mobile Dropdown Panel */}
                    <div className={`fixed top-[64px] left-0 w-full bg-obsidian/95 backdrop-blur-xl border-b border-white/10 z-30 md:hidden flex flex-col items-center py-6 shadow-2xl transition-all duration-300 origin-top overflow-hidden ${isMobileMenuOpen ? 'max-h-[500px] opacity-100' : 'max-h-0 opacity-0 pointer-events-none'}`}>
                        <button
                            onClick={() => handleNavClick('home')}
                            className={`font-data text-sm uppercase tracking-widest transition-colors hover:text-[#FD0033] focus:outline-none py-4 w-full text-center border-b border-white/5 ${currentPage === 'home' ? 'text-[#FD0033]' : 'text-white/60'}`}
                        >
                            [HOME]
                        </button>
                        <button
                            onClick={() => handleNavClick('work')}
                            className={`font-data text-sm uppercase tracking-widest transition-colors hover:text-[#FD0033] focus:outline-none py-4 w-full text-center border-b border-white/5 ${currentPage === 'work' ? 'text-[#FD0033]' : 'text-white/60'}`}
                        >
                            [OUR_WORK]
                        </button>
                        <button
                            onClick={() => handleNavClick('services')}
                            className={`font-data text-sm uppercase tracking-widest transition-colors hover:text-[#FD0033] focus:outline-none py-4 w-full text-center border-b border-white/5 ${currentPage === 'services' ? 'text-[#FD0033]' : 'text-white/60'}`}
                        >
                            [SERVICES]
                        </button>
                        <button
                            onClick={() => handleNavClick('about')}
                            className={`font-data text-sm uppercase tracking-widest transition-colors hover:text-[#FD0033] focus:outline-none py-4 w-full text-center border-b border-white/5 ${currentPage === 'about' ? 'text-[#FD0033]' : 'text-white/60'}`}
                        >
                            [DIRECTOR]
                        </button>
                        <button
                            onClick={() => handleNavClick('faq')}
                            className={`font-data text-sm uppercase tracking-widest transition-colors hover:text-[#FD0033] focus:outline-none py-4 w-full text-center border-b border-white/5 ${currentPage === 'faq' ? 'text-[#FD0033]' : 'text-white/60'}`}
                        >
                            [FAQ]
                        </button>
                        <div className="pt-6 pb-2 w-full px-8 flex justify-center">
                            <button onClick={handleGetStartedClick} className="w-full max-w-xs group relative overflow-hidden px-4 py-3 rounded-full border border-signal text-signal hover:text-obsidian transition-colors">
                                <span className="relative z-10 font-data text-sm font-bold uppercase tracking-wider">Get Started</span>
                                <div className="absolute inset-0 bg-signal translate-y-[100%] group-hover:translate-y-0 transition-transform duration-300 ease-out z-0"></div>
                            </button>
                        </div>
                    </div>
                </>
            );
        }

        const AboutPage = ({ setCurrentPage, navigateToForm }) => {
            const pageRef = useRef(null);

            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    gsap.from(".about-animate", {
                        y: 30,
                        opacity: 0,
                        duration: 0.8,
                        stagger: 0.15,
                        ease: "power3.out"
                    });
                }, pageRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={pageRef} className="min-h-screen pt-32 pb-24 px-4 md:px-12 relative z-10 bg-[#0D0D0D] text-[#F8FAFC]">
                    <div className="max-w-5xl mx-auto">

                        {/* Hero Section (Identity Profile) */}
                        <div className="about-animate grid grid-cols-1 md:grid-cols-2 gap-12 items-center mb-24 border-b border-white/10 pb-16">
                            {/* Left Column: Headshot */}
                            <div className="relative w-full max-w-sm mx-auto md:mx-0 aspect-[4/5] rounded-xl overflow-hidden border border-white/20 shadow-[0_0_50px_rgba(253,0,51,0.15)] group">
                                <div className="absolute inset-0 bg-[#FD0033] mix-blend-overlay opacity-10 z-10 pointer-events-none"></div>
                                <img src="./3E5C90F3-62AE-4184-BF92-2681AC4967B2_optimized_2000.jpeg" alt="Carter Wells" className="w-full h-full object-cover filter grayscale contrast-125 group-hover:grayscale-0 group-hover:contrast-100 transition-all duration-700" />
                            </div>

                            {/* Right Column: Title Block */}
                            <div className="flex flex-col items-center md:items-start text-center md:text-left">
                                <h1 className="font-emphasis text-[16vw] sm:text-7xl md:text-[8rem] tracking-tight uppercase leading-[0.85] mb-6 text-[#F8FAFC] drop-shadow-[0_0_15px_rgba(253,0,51,0.15)]">
                                    <span className="text-[#FD0033] opacity-50">[</span>DIRECTOR<span className="text-[#FD0033] opacity-50">]</span>
                                </h1>
                                <p className="font-data text-[#F8FAFC]/70 tracking-widest uppercase text-sm md:text-base mb-6 border-l-4 border-[#FD0033] pl-4">
                                    Carter Wells // <span className="text-[#F8FAFC]">ChannelScale Founder</span>
                                </p>
                            </div>
                        </div>

                        {/* Content Body */}
                        <div className="space-y-20">

                            {/* Text Module 01: SYSTEM ARCHITECTURE */}
                            <div className="about-animate grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
                                <div className="md:col-span-4 relative z-10 border-l-4 border-[#FD0033] pl-3">
                                    <h2 className="font-emphasis text-4xl md:text-5xl text-[#F8FAFC] tracking-tight uppercase mb-2">Why ChannelScale</h2>
                                </div>
                                <div className="md:col-span-8 flex flex-col gap-6">
                                    <p className="font-body text-xl md:text-2xl text-[#F8FAFC] leading-relaxed font-light">
                                        I built ChannelScale to solve the operational drag that kills high-level content. Social media management does not solve the full picture. An outside marketing team without in-house creative production loses the touch. But when you bring the creative, the direction, and the strategy under one roof, it functions like a single machine.
                                    </p>
                                    <p className="font-data text-sm md:text-base text-[#F8FAFC]/70 leading-relaxed bg-[#0A0A0B] p-6 border border-white/5 rounded-lg shadow-inner">
                                        I have been making content since 2016. Professionally for six years across graphic design, documentary cinematography, and video editing. Over the last two years I built out the internal workflows and assembled a team, running everything quietly for my own portfolio. Now I am opening it up. If you have ever tried to get your branding, strategy, and creative to actually work together without it consuming your schedule, we have already solved that problem.
                                    </p>
                                </div>
                            </div>

                            {/* Text Module 02: THE FOUNDATION */}
                            <div className="about-animate grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
                                <div className="md:col-span-4 relative z-10 border-l-4 border-[#FD0033] pl-3">
                                    <h2 className="font-emphasis text-4xl md:text-5xl text-[#F8FAFC] tracking-tight uppercase mb-2">The Foundation</h2>
                                </div>
                                <div className="md:col-span-8 flex flex-col gap-6">
                                    <p className="font-body text-xl md:text-2xl text-[#F8FAFC] leading-relaxed font-light">
                                        My approach is rooted in a Bachelor of Arts in Cinema and a decade of experience producing for organizations like the <span className="text-[#F8FAFC] font-bold">PGA Tour</span>, <span className="text-[#F8FAFC] font-bold">Iowa Hawkeye Football</span>, and the <span className="text-[#F8FAFC] font-bold">NWSL</span>. I’ve taken that professional rigor and applied it to the YouTube economy, generating <span className="text-[#F8FAFC] font-bold">six figures</span> in personal AdSense revenue from my own portfolio alone. Executive producer of <span className="text-[#F8FAFC] font-bold">Counterpoint Studios</span>, a nationally distributed dialogue series. Builder of <span className="text-[#F8FAFC] font-bold">SlicePost</span>, an internal-only pipeline tool for automated social media video clip distribution.
                                    </p>
                                    <div className="p-6 border-l-4 border-[#FD0033] bg-[#FD0033]/10">
                                        <p className="font-heading text-xl md:text-3xl text-[#F8FAFC] font-extrabold tracking-tight">
                                            "Applying these strategies to a brand that can capitalize on lead generation makes this a <span className="text-[#FD0033] drop-shadow-[0_0_15px_rgba(253,0,51,0.8)]">no-brainer</span> for any high-level voice."
                                        </p>
                                    </div>
                                </div>
                            </div>

                            {/* QC Module: The Studio Standard */}
                            <div className="about-animate grid grid-cols-1 md:grid-cols-12 gap-8 items-center border-[1px] border-[#FD0033] p-8 md:p-12 rounded-xl relative overflow-hidden bg-[#0A0A0B] shadow-[0_0_40px_rgba(253,0,51,0.1)]">
                                <div className="absolute top-0 right-0 w-64 h-64 bg-[#FD0033] blur-[120px] opacity-10 pointer-events-none"></div>
                                <div className="md:col-span-4 relative z-10">
                                    <h2 className="font-emphasis text-4xl md:text-5xl text-[#F8FAFC] tracking-tight uppercase mb-2">The Studio Standard</h2>
                                </div>
                                <div className="md:col-span-8 relative z-10">
                                    <p className="font-body text-xl md:text-2xl text-[#F8FAFC] leading-relaxed font-light">
                                        ChannelScale operates as a specialized content marketing studio. YouTube, podcast, social. Whatever the format, you get the output of a full team with the quality control of a single proven director. I personally review and finalize every strategy and frame. Let's partner together to scale your channel.
                                    </p>
                                </div>
                            </div>

                        </div>

                        {/* Action Area */}
                        <div className="about-animate mt-32 flex justify-center pt-8">
                            <button
                                onClick={navigateToForm || (() => setCurrentPage('home'))}
                                className="group relative flex items-center justify-center px-10 py-6 border border-white/20 rounded hover:border-[#FD0033] bg-[#0A0A0B] transition-all duration-300 hover:shadow-[0_0_40px_rgba(253,0,51,0.4)] overflow-hidden"
                            >
                                <span className="relative z-10 font-data text-xs md:text-sm tracking-[0.2em] uppercase text-[#F8FAFC] group-hover:text-[#FD0033] transition-colors">
                                    Get Started
                                </span>
                                <div className="absolute inset-0 bg-[#FD0033]/5 -translate-x-full group-hover:translate-x-0 transition-transform duration-500 ease-out pointer-events-none"></div>
                            </button>
                        </div>

                    </div>
                </section>
            );
        };

        const SystemConfigurationsPage = ({ setCurrentPage, navigateToForm }) => {
            const pageRef = useRef(null);

            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    gsap.from(".config-animate", {
                        y: 30,
                        opacity: 0,
                        duration: 0.8,
                        stagger: 0.15,
                        ease: "power3.out"
                    });
                }, pageRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={pageRef} className="min-h-screen pt-32 pb-24 px-4 md:px-12 relative z-10 bg-[#0D0D0D] text-[#F8FAFC]">
                    <div className="max-w-5xl mx-auto">

                        {/* Header */}
                        <div className="config-animate text-center mb-20 border-b border-white/10 pb-16">
                            <h1 className="font-emphasis text-[9.5vw] sm:text-6xl md:text-[6rem] lg:text-[7rem] tracking-tight uppercase leading-[0.85] mb-6 text-[#F8FAFC] drop-shadow-[0_0_15px_rgba(253,0,51,0.15)] break-words break-all sm:break-normal">
                                <span className="text-[#FD0033] opacity-50">[</span>SERVICES<span className="text-[#FD0033] opacity-50">]</span>
                            </h1>
                            <p className="font-data text-[#F8FAFC]/50 tracking-widest uppercase text-sm md:text-base">
                                Creative. Direction. Strategy. One roof.
                            </p>
                        </div>

    <!-- Interactive Particle Background -->
    <script>
    (function () {
        // ── Canvas ────────────────────────────────────────────────────────
        const canvas = document.createElement('canvas');
        canvas.id = 'cs-bg';
        Object.assign(canvas.style, {
            position: 'fixed', top: '0', left: '0',
            width: '100%', height: '100%',
            pointerEvents: 'none',
            zIndex: '3',
            mixBlendMode: 'screen',
        });
        document.body.appendChild(canvas);
        const ctx = canvas.getContext('2d', { alpha: true, willReadFrequently: false });

        // ── Custom cursor (desktop only) ──────────────────────────────────
        // Cursor positioning uses CSS transform (GPU-composited, no paint cost)
        // instead of left/top (which triggers paint every frame).
        const isTouchDevice = window.matchMedia('(hover: none)').matches;
        let cursorDot, cursorRing, cursorHalfSize = 20;
        if (!isTouchDevice) {
            document.body.style.cursor = 'none';

            cursorDot = document.createElement('div');
            Object.assign(cursorDot.style, {
                position: 'fixed', top: '0', left: '0',
                width: '8px', height: '8px',
                background: '#FD0033',
                borderRadius: '50%',
                pointerEvents: 'none',
                zIndex: '9999',
                willChange: 'transform',
                boxShadow: '0 0 10px #FD0033, 0 0 22px rgba(253,0,51,0.5)',
            });

            cursorRing = document.createElement('div');
            Object.assign(cursorRing.style, {
                position: 'fixed', top: '0', left: '0',
                width: '40px', height: '40px',
                border: '1.5px solid rgba(253,0,51,0.55)',
                borderRadius: '50%',
                pointerEvents: 'none',
                zIndex: '9998',
                willChange: 'transform',
                transition: 'width .22s cubic-bezier(.25,.46,.45,.94), height .22s cubic-bezier(.25,.46,.45,.94), border-color .18s',
            });

            document.body.append(cursorDot, cursorRing);

            document.addEventListener('mouseover', e => {
                const el = e.target.closest('a, button, [role="button"], input, textarea, select, label');
                if (el) {
                    cursorRing.style.width  = '62px';
                    cursorRing.style.height = '62px';
                    cursorRing.style.borderColor = 'rgba(253,0,51,1)';
                    cursorHalfSize = 31;
                } else {
                    cursorRing.style.width  = '40px';
                    cursorRing.style.height = '40px';
                    cursorRing.style.borderColor = 'rgba(253,0,51,0.55)';
                    cursorHalfSize = 20;
                }
            });
        }

        // ── State ─────────────────────────────────────────────────────────
        let W, H, animT = 0;
        let mouseX = -2000, mouseY = -2000, mouseActive = false;
        const ringPos = { x: -2000, y: -2000 };

        function resize() {
            W = canvas.width  = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // ── Pre-cached color strings — eliminates per-frame string GC ────
        const STEPS = 64;
        const RED_LINE = [], WHT_LINE = [], RED_FILL = [], WHT_FILL = [], RED_SHADOW = [];
        for (let i = 0; i < STEPS; i++) {
            const f = i / (STEPS - 1);
            RED_LINE[i]   = 'rgba(253,0,51,'    + (f * 0.42).toFixed(3) + ')';
            WHT_LINE[i]   = 'rgba(226,232,240,' + (f * 0.22).toFixed(3) + ')';
            RED_FILL[i]   = 'rgba(255,60,80,'   + f.toFixed(3)          + ')';
            WHT_FILL[i]   = 'rgba(226,232,240,' + f.toFixed(3)          + ')';
            RED_SHADOW[i] = 'rgba(253,0,51,'    + (f * 0.70).toFixed(3) + ')';
        }

        // ── Connection batch buckets (8 levels) — one stroke() per bucket ─
        // Reduces ~700+ individual GPU flushes per frame down to 16 max.
        const BUCKETS = 8;
        const redBatch = Array.from({ length: BUCKETS }, () => []);
        const whtBatch = Array.from({ length: BUCKETS }, () => []);
        const RED_LINE_B = Array.from({ length: BUCKETS }, (_, i) =>
            'rgba(253,0,51,'    + ((i / (BUCKETS - 1)) * 0.42).toFixed(3) + ')');
        const WHT_LINE_B = Array.from({ length: BUCKETS }, (_, i) =>
            'rgba(226,232,240,' + ((i / (BUCKETS - 1)) * 0.22).toFixed(3) + ')');
        const LW_RED_B = Array.from({ length: BUCKETS }, (_, i) => (i / (BUCKETS - 1)) * 1.4);
        const LW_WHT_B = Array.from({ length: BUCKETS }, (_, i) => (i / (BUCKETS - 1)) * 0.9);

        // ── Particles ─────────────────────────────────────────────────────
        const isMobile  = window.innerWidth < 768;
        const N         = isMobile ? 50 : 100;
        const CONNECT   = isMobile ? 120 : 160;
        const CONNECT2  = CONNECT * CONNECT;
        const REPEL     = 210;
        const REPEL2    = REPEL * REPEL;
        function rnd(a, b) { return a + Math.random() * (b - a); }

        const particles = Array.from({ length: N }, (_, i) => {
            const isRed = i < Math.floor(N * 0.14);
            return {
                x: Math.random() * W, y: Math.random() * H,
                vx: (Math.random() - .5) * .28, vy: (Math.random() - .5) * .28,
                r:      isRed ? rnd(1.2, 2.2) : rnd(0.7, 1.8),
                baseOp: isRed ? rnd(0.55, 0.85) : rnd(0.28, 0.56),
                op: 0, red: isRed,
                phase: Math.random() * Math.PI * 2,
            };
        });
        particles.forEach(p => p.op = p.baseOp);

        // ── Input ─────────────────────────────────────────────────────────
        // mousemove ONLY records coords — the dot is positioned inside RAF on a
        // steady cadence. Updating the dot here causes bursty/coalesced jitter
        // when the main thread is busy (the "lags every few seconds" effect).
        window.addEventListener('mousemove', e => {
            mouseX = e.clientX; mouseY = e.clientY; mouseActive = true;
        });
        window.addEventListener('touchmove', e => {
            mouseX = e.touches[0].clientX; mouseY = e.touches[0].clientY; mouseActive = true;
        }, { passive: true });
        window.addEventListener('touchend',   () => { mouseActive = false; });
        window.addEventListener('mouseleave', () => { mouseActive = false; });

        // ── Render loop ───────────────────────────────────────────────────
        function tick() {
            requestAnimationFrame(tick);

            // Position the cursor FIRST, before any canvas work, so it lands on
            // a consistent frame cadence and never waits on the heavy draw below.
            if (cursorDot) {
                cursorDot.style.transform =
                    'translate(' + Math.round(mouseX - 4) + 'px,' + Math.round(mouseY - 4) + 'px)';
            }
            ringPos.x += (mouseX - ringPos.x) * .18;
            ringPos.y += (mouseY - ringPos.y) * .18;
            if (cursorRing) {
                cursorRing.style.transform =
                    'translate(' + Math.round(ringPos.x - cursorHalfSize) + 'px,' +
                                   Math.round(ringPos.y - cursorHalfSize) + 'px)';
            }

            ctx.clearRect(0, 0, W, H);
            animT += 0.011;

            // Cursor glow — one gradient object per active frame (cheap)
            if (mouseActive) {
                const g = ctx.createRadialGradient(mouseX, mouseY, 0, mouseX, mouseY, 380);
                g.addColorStop(0,    'rgba(253,0,51,0.13)');
                g.addColorStop(0.35, 'rgba(253,0,51,0.05)');
                g.addColorStop(1,    'rgba(0,0,0,0)');
                ctx.fillStyle = g;
                ctx.fillRect(0, 0, W, H);
            }

            // ── Physics + opacity update ──────────────────────────────────
            for (let i = 0; i < N; i++) {
                const p = particles[i];
                if (mouseActive) {
                    const dx = p.x - mouseX, dy = p.y - mouseY;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < REPEL2 && d2 > 0) {
                        const d = Math.sqrt(d2);
                        const f = (1 - d / REPEL) * 0.028;
                        p.vx += (dx / d) * f; p.vy += (dy / d) * f;
                        p.op  = p.baseOp + (1 - d / REPEL) * 0.42;
                    } else { p.op += (p.baseOp - p.op) * .05; }
                } else { p.op += (p.baseOp - p.op) * .05; }

                const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
                if (spd > 1.6) { p.vx = p.vx / spd * 1.6; p.vy = p.vy / spd * 1.6; }
                p.vx *= .972; p.vy *= .972;
                p.x += p.vx; p.y += p.vy;
                if (p.x < -6) p.x = W + 6; else if (p.x > W + 6) p.x = -6;
                if (p.y < -6) p.y = H + 6; else if (p.y > H + 6) p.y = -6;
            }

            // ── Connection bucketing (squared-distance pre-check) ─────────
            for (let b = 0; b < BUCKETS; b++) { redBatch[b].length = 0; whtBatch[b].length = 0; }
            for (let i = 0; i < N; i++) {
                const p = particles[i];
                for (let j = i + 1; j < N; j++) {
                    const q  = particles[j];
                    const dx = p.x - q.x, dy = p.y - q.y;
                    const d2 = dx * dx + dy * dy;
                    if (d2 < CONNECT2) {
                        const str    = 1 - Math.sqrt(d2) / CONNECT;
                        const bucket = Math.min(Math.floor(str * BUCKETS), BUCKETS - 1);
                        const arr    = (p.red || q.red) ? redBatch[bucket] : whtBatch[bucket];
                        arr.push(p.x, p.y, q.x, q.y);
                    }
                }
            }
            // Flush each bucket in one stroke() call
            for (let b = 0; b < BUCKETS; b++) {
                const rb = redBatch[b];
                if (rb.length) {
                    ctx.beginPath();
                    for (let k = 0; k < rb.length; k += 4) { ctx.moveTo(rb[k], rb[k+1]); ctx.lineTo(rb[k+2], rb[k+3]); }
                    ctx.strokeStyle = RED_LINE_B[b]; ctx.lineWidth = LW_RED_B[b]; ctx.stroke();
                }
                const wb = whtBatch[b];
                if (wb.length) {
                    ctx.beginPath();
                    for (let k = 0; k < wb.length; k += 4) { ctx.moveTo(wb[k], wb[k+1]); ctx.lineTo(wb[k+2], wb[k+3]); }
                    ctx.strokeStyle = WHT_LINE_B[b]; ctx.lineWidth = LW_WHT_B[b]; ctx.stroke();
                }
            }

            // ── Draw particles ────────────────────────────────────────────
            for (let i = 0; i < N; i++) {
                const p      = particles[i];
                const breath = Math.sin(animT * 1.4 + p.phase) * 0.1;
                const op     = Math.min(Math.max(p.op + breath, 0), 1);
                const idx    = Math.min(Math.floor(op * (STEPS - 1)), STEPS - 1);

                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                if (p.red) {
                    // shadowBlur glow — GPU-side blur, zero JS object allocation
                    ctx.shadowColor = RED_SHADOW[idx];
                    ctx.shadowBlur  = p.r * 7;
                    ctx.fillStyle   = RED_FILL[idx];
                    ctx.fill();
                    ctx.shadowBlur  = 0;
                } else {
                    ctx.fillStyle = WHT_FILL[idx];
                    ctx.fill();
                }
            }
        }

        tick();
    })();
    </script>
