<body class="bg-obsidian text-steel font-body antialiased overflow-x-hidden selection:bg-signal selection:text-white">
    <!-- Global Analog Grain Overlay -->
    <div class="analog-grain"></div>

    <div id="root"></div>

    <script type="text/babel">
        // Register GSAP plugins
        gsap.registerPlugin(ScrollTrigger);

        const { useState, useEffect, useRef, useLayoutEffect } = React;

        const App = () => {
            const [currentPage, setCurrentPage] = useState('home');

            useEffect(() => {
                lucide.createIcons();
                window.scrollTo(0, 0); // scroll to top when page changes
            }, [currentPage]);

            const navigateToForm = () => {
                setCurrentPage('home');
                setTimeout(() => {
                    const formEl = document.getElementById('intake-form');
                    if (formEl) {
                        formEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }, 100);
            };

            return (
                <div className="relative w-full">
                    <NavBar setCurrentPage={setCurrentPage} currentPage={currentPage} navigateToForm={navigateToForm} />

                    {currentPage === 'home' ? (
                        <>
                            <HeroSection />
                            <StatsSection />
                            <OfferSection navigateToForm={navigateToForm} />
                            <ResultsSection setCurrentPage={setCurrentPage} navigateToForm={navigateToForm} />
                            <ProcessSection />
                            <HomeFAQSection setCurrentPage={setCurrentPage} />
                            <StrategicIntakeSection />
                            <MobileApplyBar />
                        </>
                    ) : currentPage === 'work' ? (
                        <WorkPage setCurrentPage={setCurrentPage} navigateToForm={navigateToForm} />
                    ) : currentPage === 'about' ? (
                        <AboutPage setCurrentPage={setCurrentPage} navigateToForm={navigateToForm} />
                    ) : currentPage === 'faq' ? (
                        <FAQPage setCurrentPage={setCurrentPage} navigateToForm={navigateToForm} />
                    ) : currentPage === 'privacy' ? (
                        <PrivacyPolicyPage setCurrentPage={setCurrentPage} />
                    ) : currentPage === 'terms' ? (
                        <TermsOfServicePage setCurrentPage={setCurrentPage} />
                    ) : currentPage === 'disclaimer' ? (
                        <DisclaimerPage setCurrentPage={setCurrentPage} />
                    ) : (
                        <SystemConfigurationsPage setCurrentPage={setCurrentPage} navigateToForm={navigateToForm} />
                    )}

                    <SiteFooter setCurrentPage={setCurrentPage} />
                </div>
            );
        };

        const AboutPage = ({ setCurrentPage, navigateToForm }) => {
            const pageRef = useRef(null);

            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    gsap.from(".about-animate", {
                        y: 30,
                        opacity: 0,
                        duration: 0.8,
                        stagger: 0.15,
                        ease: "power3.out"
                    });
                }, pageRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={pageRef} className="min-h-screen pt-32 pb-24 px-4 md:px-12 relative z-10 bg-[#0D0D0D] text-[#F8FAFC]">
                    <div className="max-w-5xl mx-auto">

                        {/* Hero Section (Identity Profile) */}
                        <div className="about-animate grid grid-cols-1 md:grid-cols-2 gap-12 items-center mb-24 border-b border-white/10 pb-16">
                            {/* Left Column: Headshot */}
                            <div className="relative w-full max-w-sm mx-auto md:mx-0 aspect-[4/5] rounded-xl overflow-hidden border border-white/20 shadow-[0_0_50px_rgba(253,0,51,0.15)] group">
                                <div className="absolute inset-0 bg-[#FD0033] mix-blend-overlay opacity-10 z-10 pointer-events-none"></div>
                                <img src="./3E5C90F3-62AE-4184-BF92-2681AC4967B2_optimized_2000.jpeg" alt="Carter Wells" className="w-full h-full object-cover filter grayscale contrast-125 group-hover:grayscale-0 group-hover:contrast-100 transition-all duration-700" />
                            </div>

                            {/* Right Column: Title Block */}
                            <div className="flex flex-col items-center md:items-start text-center md:text-left">
                                <span className="cs-eyebrow mb-6"><span className="cs-dot"></span>Founder and director</span>
                                <h1 className="font-emphasis uppercase leading-[0.88] mb-6 text-white" style={{ fontSize: 'clamp(3.25rem, 10vw, 8rem)' }}>Carter Wells</h1>
                                <p className="font-data text-[#F8FAFC]/70 tracking-widest uppercase text-sm md:text-base mb-6 border-l-4 border-[#FD0033] pl-4">
                                    Film degree. <span className="text-[#F8FAFC]">PGA Tour, Iowa Hawkeyes, NWSL.</span>
                                </p>
                            </div>
                        </div>

                        {/* Content Body */}
                        <div className="space-y-20">

                            {/* Text Module 01: SYSTEM ARCHITECTURE */}
                            <div className="about-animate grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
                                <div className="md:col-span-4 relative z-10 border-l-4 border-[#FD0033] pl-3">
                                    <h2 className="font-emphasis text-4xl md:text-5xl text-[#F8FAFC] tracking-tight uppercase mb-2">Why ChannelScale</h2>
                                </div>
                                <div className="md:col-span-8 flex flex-col gap-6">
                                    <p className="font-body text-xl md:text-2xl text-[#F8FAFC] leading-relaxed font-light">
                                        I built ChannelScale for people with a show worth watching and no time to finish it. Recording is the part you are good at. Everything after it, syncing angles, cutting, cleaning audio, packaging, clipping and posting, is where most podcasts stall. That part is what we do.
                                    </p>
                                    <p className="font-data text-sm md:text-base text-[#F8FAFC]/70 leading-relaxed bg-[#0A0A0B] p-6 border border-white/5 rounded-lg shadow-inner">
                                        I have been making content since 2016. Professionally for six years across graphic design, documentary cinematography, and video editing. Over the last two years I built the workflows that run my own shows: a multicam editing pipeline, an automated clip system and a packaging process for titles and thumbnails. I assembled a team around them and ran everything quietly for my own portfolio. Now I am opening that operation up to a small number of podcasts.
                                    </p>
                                </div>
                            </div>

                            {/* Text Module 02: THE FOUNDATION */}
                            <div className="about-animate grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
                                <div className="md:col-span-4 relative z-10 border-l-4 border-[#FD0033] pl-3">
                                    <h2 className="font-emphasis text-4xl md:text-5xl text-[#F8FAFC] tracking-tight uppercase mb-2">The Foundation</h2>
                                </div>
                                <div className="md:col-span-8 flex flex-col gap-6">
                                    <p className="font-body text-xl md:text-2xl text-[#F8FAFC] leading-relaxed font-light">
                                        My approach is rooted in a Bachelor of Arts in Cinema and a decade of experience producing for organizations like the <span className="text-[#F8FAFC] font-bold">PGA Tour</span>, <span className="text-[#F8FAFC] font-bold">Iowa Hawkeye Football</span>, and the <span className="text-[#F8FAFC] font-bold">NWSL</span>. I’ve taken that professional rigor and applied it to the YouTube economy, generating <span className="text-[#F8FAFC] font-bold">six figures</span> in personal AdSense revenue from my own portfolio alone. Executive producer of <span className="text-[#F8FAFC] font-bold">Counterpoint Studios</span>, a nationally distributed dialogue series. Builder of <span className="text-[#F8FAFC] font-bold">SlicePost</span>, an internal-only pipeline tool for automated social media video clip distribution.
                                    </p>
                                    <div className="p-6 border-l-4 border-[#FD0033] bg-[#FD0033]/10">
                                        <p className="font-heading text-xl md:text-3xl text-[#F8FAFC] font-extrabold tracking-tight">
                                            "If your show is worth recording, it is worth <span className="text-[#FD0033] drop-shadow-[0_0_15px_rgba(253,0,51,0.8)]">finishing properly</span>."
                                        </p>
                                    </div>
                                </div>
                            </div>

                            {/* QC Module: The Studio Standard */}
                            <div className="about-animate grid grid-cols-1 md:grid-cols-12 gap-8 items-center border-[1px] border-[#FD0033] p-8 md:p-12 rounded-xl relative overflow-hidden bg-[#0A0A0B] shadow-[0_0_40px_rgba(253,0,51,0.1)]">
                                <div className="absolute top-0 right-0 w-64 h-64 bg-[#FD0033] blur-[120px] opacity-10 pointer-events-none"></div>
                                <div className="md:col-span-4 relative z-10">
                                    <h2 className="font-emphasis text-4xl md:text-5xl text-[#F8FAFC] tracking-tight uppercase mb-2">The Studio Standard</h2>
                                </div>
                                <div className="md:col-span-8 relative z-10">
                                    <p className="font-body text-xl md:text-2xl text-[#F8FAFC] leading-relaxed font-light">
                                        ChannelScale is a done-for-you podcast studio. You get the output of a full post-production team with the quality control of a single director. I personally review the work on every show before it ships, so the standard on episode 40 matches episode 1.
                                    </p>
                                </div>
                            </div>

                        </div>

                        {/* Action Area */}
                        <div className="about-animate mt-32 flex justify-center pt-8">
                            <button onClick={navigateToForm || (() => setCurrentPage('home'))} className="cs-btn-primary cs-btn-lg">
                                <span>Apply to work with us</span>
                                <ArrowIcon />
                            </button>
                        </div>

                    </div>
                </section>
            );
        };

        const SystemConfigurationsPage = ({ setCurrentPage, navigateToForm }) => {
            const pageRef = useRef(null);

            useLayoutEffect(() => {
                let ctx = gsap.context(() => {
                    gsap.from(".config-animate", {
                        y: 30,
                        opacity: 0,
                        duration: 0.8,
                        stagger: 0.15,
                        ease: "power3.out"
                    });
                }, pageRef);
                return () => ctx.revert();
            }, []);

            return (
                <section ref={pageRef} className="min-h-screen pt-32 pb-24 px-4 md:px-12 relative z-10 bg-[#0D0D0D] text-[#F8FAFC]">
                    <div className="max-w-5xl mx-auto">

                        {/* Header */}
                        <div className="config-animate text-center mb-20 border-b border-white/10 pb-16">
                            <span className="cs-eyebrow mb-6"><span className="cs-dot"></span>Done-for-you podcast production</span>
                            <h1 className="font-emphasis uppercase leading-[0.88] mb-6 text-white" style={{ fontSize: 'clamp(3.25rem, 10vw, 8rem)' }}>The offer</h1>
                            <p className="font-data text-[#F8FAFC]/50 tracking-widest uppercase text-sm md:text-base">
                                Everything after you hit record.
                            </p>
                        </div>

                        <div className="space-y-20">

                            {/* Positioning block */}
                            <div className="config-animate border border-[#FD0033] p-8 md:p-12 rounded-xl relative overflow-hidden bg-[#0A0A0B] shadow-[0_0_30px_rgba(253,0,51,0.2)]">
                                <div className="absolute top-0 right-0 w-64 h-64 bg-[#FD0033] blur-[120px] opacity-10 pointer-events-none"></div>
                                <div className="relative z-10 space-y-6">
                                    <p className="font-body text-xl md:text-2xl text-[#F8FAFC] leading-relaxed font-light border-l-4 border-[#FD0033] pl-6">
                                        You record the episode. We handle everything after.
                                    </p>
                                    <p className="font-body text-lg text-[#F8FAFC]/70 leading-relaxed font-light">
                                        Most podcasters spend more hours editing, packaging and posting than they spend recording. ChannelScale takes all of it for one monthly price: the edit, the YouTube packaging, the clips and the posting. One team, one point of contact, the same standard every week.
                                    </p>
                                </div>
                            </div>

                            {/* One offer callout */}
                            <div className="config-animate flex items-start gap-5 bg-white/[0.03] border border-white/10 rounded-xl p-7 md:p-10">
                                <div className="w-1.5 h-full min-h-[48px] bg-[#FD0033] rounded-full flex-shrink-0 mt-1"></div>
                                <div>
                                    <p className="font-heading font-bold text-lg md:text-xl text-[#F8FAFC] mb-2 uppercase tracking-wide">One offer. One monthly price.</p>
                                    <p className="font-body text-[#F8FAFC]/70 leading-relaxed">
                                        Partnerships start at $4,000 per month on a six-month term. Your quote is set on the call by episode length, camera count and the platforms we post to. Interview, co-hosted, solo and talking-head shows all get the same deliverable.
                                    </p>
                                </div>
                            </div>

                            {/* Deliverables */}
                            <div className="config-animate">
                                <p className="font-data text-[#FD0033] text-xs uppercase tracking-[0.3em] mb-8">What you get every month</p>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-x-12 gap-y-10">
                                    <div className="border-l-4 border-white/10 pl-6 hover:border-[#FD0033] transition-colors group">
                                        <div className="flex items-center gap-4 mb-3">
                                            <i data-lucide="film" className="w-6 h-6 text-[#FD0033] group-hover:drop-shadow-[0_0_8px_rgba(253,0,51,0.8)] transition-all flex-shrink-0"></i>
                                            <h4 className="font-emphasis text-2xl tracking-wide uppercase text-[#F8FAFC]">4 Full Episode Edits</h4>
                                        </div>
                                        <p className="font-body text-[#F8FAFC]/70 font-light leading-relaxed">
                                            Every camera angle synced and cut as a multicam. Audio cleaned and leveled, color corrected, pacing tightened. A finished episode ready for YouTube and every podcast app.
                                        </p>
                                    </div>
                                    <div className="border-l-4 border-white/10 pl-6 hover:border-[#FD0033] transition-colors group">
                                        <div className="flex items-center gap-4 mb-3">
                                            <i data-lucide="image" className="w-6 h-6 text-[#FD0033] group-hover:drop-shadow-[0_0_8px_rgba(253,0,51,0.8)] transition-all flex-shrink-0"></i>
                                            <h4 className="font-emphasis text-2xl tracking-wide uppercase text-[#F8FAFC]">YouTube Packaging</h4>
                                        </div>
                                        <p className="font-body text-[#F8FAFC]/70 font-light leading-relaxed">
                                            A researched title, a custom thumbnail, timestamped chapters, a written description and tags on every upload. The packaging decides whether anyone clicks.
                                        </p>
                                    </div>
                                    <div className="border-l-4 border-white/10 pl-6 hover:border-[#FD0033] transition-colors group">
                                        <div className="flex items-center gap-4 mb-3">
                                            <i data-lucide="scissors" className="w-6 h-6 text-[#FD0033] group-hover:drop-shadow-[0_0_8px_rgba(253,0,51,0.8)] transition-all flex-shrink-0"></i>
                                            <h4 className="font-emphasis text-2xl tracking-wide uppercase text-[#F8FAFC]">20-30 Clips a Month</h4>
                                        </div>
                                        <p className="font-body text-[#F8FAFC]/70 font-light leading-relaxed">
                                            The strongest moments from each episode, cut vertical, framed on the speaker and captioned. Built to bring new listeners back to the full episode.
                                        </p>
                                    </div>
                                    <div className="border-l-4 border-white/10 pl-6 hover:border-[#FD0033] transition-colors group">
                                        <div className="flex items-center gap-4 mb-3">
                                            <i data-lucide="send" className="w-6 h-6 text-[#FD0033] group-hover:drop-shadow-[0_0_8px_rgba(253,0,51,0.8)] transition-all flex-shrink-0"></i>
                                            <h4 className="font-emphasis text-2xl tracking-wide uppercase text-[#F8FAFC]">Posting & Scheduling</h4>
                                        </div>
                                        <p className="font-body text-[#F8FAFC]/70 font-light leading-relaxed">
                                            Episodes and clips scheduled and published to YouTube, Shorts, Instagram, TikTok, X and Facebook. Your channels stay active every week.

                                        <h3 className="cs-title mt-8 !text-4xl md:!text-5xl">Application received.</h3>
                                        <p className="font-body text-white/60 max-w-md mx-auto text-base md:text-lg leading-relaxed mt-5">
                                            Thanks for applying. If it looks like a fit, we will reach out within 1-2 business days to schedule a call.
                                        </p>
                                    </div>
                                )}
                            </div>
                            {showCal && !isSuccess && (
                                <div ref={calRef} className="w-full mt-6 rounded-[28px] border border-white/10 bg-[#0D0D0F]/80 p-2 md:p-4 scroll-mt-24">
                                    <div id="my-cal-inline" style={{ width: '100%', minHeight: '620px' }}></div>
                                </div>
                            )}
                        </div>
                    </div>
                </section>
            );
        };

        // ── Home: mobile apply bar ────────────────────────────────────────
        const MobileApplyBar = () => {
            const [visible, setVisible] = useState(false);
            useEffect(() => {
                const onScroll = () => {
                    const form = document.getElementById('intake-form');
                    const formTop = form ? form.getBoundingClientRect().top : Infinity;
                    setVisible(window.scrollY > 700 && formTop > window.innerHeight * 0.6);
                };
                onScroll();
                window.addEventListener('scroll', onScroll, { passive: true });
                return () => window.removeEventListener('scroll', onScroll);
            }, []);

            return (
                <div className={`md:hidden fixed bottom-3 inset-x-3 z-40 transition-all duration-300 ${visible ? 'translate-y-0 opacity-100' : 'translate-y-24 opacity-0 pointer-events-none'}`}>
                    <div className="flex items-center justify-between gap-3 rounded-full border border-white/10 bg-[#0A0A0B]/90 backdrop-blur-xl pl-5 pr-1.5 py-1.5 shadow-[0_10px_40px_-5px_rgba(0,0,0,0.9)]">
                        <span className="font-body text-[13px] text-white/70 leading-tight">First episode in 7 days</span>
                        <ApplyButton label="Apply" className="cs-btn-sm" />
                    </div>
                </div>
            );
        };

        // ── Footer ────────────────────────────────────────────────────────
        const SiteFooter = ({ setCurrentPage }) => {
            const go = (e, page) => {
                e.preventDefault();
                setCurrentPage(page);
                window.scrollTo(0, 0);
            };

            return (
                <footer className="relative z-10 w-full border-t border-white/[0.06] bg-[#050505] px-4 md:px-12 pt-16 pb-10">
                    <div className="max-w-6xl mx-auto">
                        <div className="flex flex-col md:flex-row justify-between gap-10">
                            <div>
                                <div className="flex items-center gap-2.5">
                                    <span className="w-2.5 h-2.5 rounded-full bg-signal shadow-[0_0_12px_#FD0033]"></span>
                                    <span className="font-heading text-lg tracking-tight text-white">CHANNELSCALE</span>
                                </div>
                                <p className="font-body text-sm text-white/45 mt-3 max-w-xs">Done-for-you podcast production. You hit record, we handle everything after.</p>
                            </div>
                            <div className="grid grid-cols-2 gap-x-16 gap-y-3">
                                {[['home', 'Home'], ['work', 'Work'], ['services', 'Offer'], ['about', 'About'], ['faq', 'FAQ']].map(([p, l]) => (
                                    <a key={p} href="#" onClick={(e) => go(e, p)} className="font-body text-sm text-white/55 hover:text-white transition-colors">{l}</a>
                                ))}
                            </div>
                        </div>

                        <p className="font-body text-[11px] text-white/25 leading-relaxed mt-14 pt-8 border-t border-white/[0.06] max-w-4xl">
                            Results are not guaranteed and are not typical. Client success depends on individual effort, experience, application, and many other factors unique to each business. Testimonials reflect exceptional outcomes and should not be considered average. Noia Media LLC makes no guarantee of financial results. All information provided is for educational purposes only and should not be considered professional advice.
                        </p>

                        <div className="mt-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                            <p className="font-data text-[10px] text-white/30 tracking-widest uppercase">
                                © {new Date().getFullYear()} ChannelScale, a Noia Media LLC company
                            </p>
                            <div className="flex flex-wrap gap-x-6 gap-y-2">
                                <a href="#" onClick={(e) => go(e, 'privacy')} className="font-body text-xs text-white/40 hover:text-white transition-colors">Privacy Policy</a>
                                <a href="#" onClick={(e) => go(e, 'terms')} className="font-body text-xs text-white/40 hover:text-white transition-colors">Terms of Service</a>
                                <a href="#" onClick={(e) => go(e, 'disclaimer')} className="font-body text-xs text-white/40 hover:text-white transition-colors">Disclaimers</a>
                            </div>
                        </div>
                    </div>
                </footer>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
